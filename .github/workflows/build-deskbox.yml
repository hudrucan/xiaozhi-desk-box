# Rebuild the known Bookworm base image as the standalone Desk Box target.
name: Build Desk Box Image

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream ophub release tag containing the base image"
        required: true
        default: "Armbian_bookworm_arm64_server_2026.09"
        type: string
      upstream_image:
        description: "Exact upstream base-image asset"
        required: true
        default: "Armbian_26.11.0-trunk_bookworm_arm64_6.18.52.img.gz"
        type: string
      upstream_sha256:
        description: "SHA256 of the compressed upstream base image"
        required: true
        default: "66f8644775a4cff85a266fc8c2fecb1a97aa93d12f03e317c0f801e82fc52f95"
        type: string
      kernel_version:
        description: "Exact rk35xx kernel version"
        required: true
        default: "6.1.174"
        type: string
      kernel_sha256:
        description: "SHA256 of the compressed rk35xx kernel bundle"
        required: true
        default: "c822f4c2dbaa9d20135ef82f388e4e574ca8b5d33b886e7b089b0defd9dbf328"
        type: string

permissions:
  contents: write

concurrency:
  group: build-deskbox-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Ho_Chi_Minh
  UPSTREAM_REPOSITORY: ophub/amlogic-s9xxx-armbian

jobs:
  build:
    name: rk35xx-${{ inputs.kernel_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout this fork
        uses: actions/checkout@v6

      - name: Verify Desk Box inputs
        shell: bash
        run: |
          set -euo pipefail
          dtb="build-armbian/armbian-files/platform-files/rockchip/bootfs/dtb/rockchip/rk3528-deskbox.dtb"
          dts="build-armbian/armbian-files/different-files/deskbox/dts/rk3528-deskbox.dts"
          echo "bf284aae2aac156705657c8393f58c21bb1c306030fea5e1d7a78087586b129b  ${dtb}" | sha256sum --check
          echo "287b252d5b88e54c5b413ac1fe21da6b8cfa782c4bde82f009c13cd62e8ae1d9  ${dts}" | sha256sum --check
          echo "f00a2e0b48fd29504292fc46007a505efe275f91b8b1863d499e6c141fc54eb8  build-armbian/armbian-files/different-files/deskbox/u-boot/bootloader.bin" | sha256sum --check
          firmware="build-armbian/armbian-files/common-files/usr/lib/firmware/aic8800_sdio"
          echo "8490a8609f8801f9cc33617c975372f4a45b62a59c3728d8975f09de4ed5e678  ${firmware}/aic_userconfig_8800d80.txt" | sha256sum --check
          echo "6d121e015ff1fb90a90649627d663511804771b37f6cb44c97066cfc313a067a  ${firmware}/fmacfw_8800d80_u02.bin" | sha256sum --check
          echo "465106f3bb2945bbdebea99f6cde9465ae00d5829e188499d42449cbdf4fe82c  ${firmware}/fmacfwbt_8800d80_u02.bin" | sha256sum --check
          echo "a526cbd02fcdc495f049f3ad6b5933cb08cd984b16790c716a060d582fee1a56  ${firmware}/fw_adid_8800d80_u02.bin" | sha256sum --check
          echo "26183182bf07f8f7581e82da8b606d222591a12c56772e75146588eef5196242  ${firmware}/fw_patch_8800d80_u02.bin" | sha256sum --check
          echo "a9f663eb7443bc8046f2479cedfcdd93001eb64761f855317dbdbbc077f475cf  ${firmware}/fw_patch_table_8800d80_u02.bin" | sha256sum --check
          echo "19b2d6b2320b67cb874c5c5c266a8f348cf423d00c0b22d4ad2c737cc603beab  ${firmware}/lmacfw_rf_8800d80_u02.bin" | sha256sum --check
          test "$(find "${firmware}" -maxdepth 1 -type f | wc -l)" -eq 7
          echo "9d171281bfe7acc5d203007427f6075b704b7a48ff42ae25b9f490a0118fe7d2  build-armbian/armbian-files/common-files/usr/lib/firmware/regulatory.db" | sha256sum --check
          echo "d1170298577027c2da346242627ff6cad09fbebaa96a6b2de07ada7c873dd337  build-armbian/armbian-files/common-files/usr/lib/firmware/regulatory.db.p7s" | sha256sum --check
          echo "e99de09d48321f36f87d9e0017c57b57c6e38203b17b28640094a18c1d98905d  build-armbian/armbian-files/different-files/deskbox/packages/bluez_5.66-1+deb12u2_arm64.deb" | sha256sum --check
          echo "f9a3003b6bb7bb79c6d017355c3ce6ba9b64d7f32fb95a8bf8158d6185c04f41  build-armbian/armbian-files/different-files/deskbox/rootfs/usr/libexec/deskbox-bluetooth-ready" | sha256sum --check
          echo "996408f13c167f0907d97d1bb891bf30a5a5a5cee31d7c762eca0a38a7a86d3a  build-armbian/armbian-files/different-files/deskbox/rootfs/usr/libexec/deskbox-bluetooth-unblock" | sha256sum --check
          echo "dce3bb6794144a5716933c924e358b8e0b2c0b61220e7b34740e8ce9beb5a20c  build-armbian/armbian-files/different-files/deskbox/rootfs/etc/systemd/system/deskbox-bluetooth.service" | sha256sum --check
          echo "e924b9300c9f5c9e1f699659f9d45e7ea6861ad006bd411a9b462c7f33b45720  build-armbian/armbian-files/different-files/deskbox/rootfs/etc/systemd/system/bluetooth.service.d/deskbox.conf" | sha256sum --check
          echo "b457abf72efd178a17056436c946c67c67dcdb4b8e4f3f6b03e2159bd0264594  build-armbian/armbian-files/different-files/deskbox/rootfs/etc/udev/rules.d/10-wifi-disable-powermanagement.rules" | sha256sum --check
          echo "e113119cb53140e84aa8b78d1c219df954f66f196d35c8d1911a5404783d7ebe  build-armbian/armbian-files/different-files/deskbox/rootfs/etc/tmpfiles.d/journal-nocow.conf" | sha256sum --check
          echo "fc98793c00ff26d97cd5a4ab4dae67603dd158cc43efd2b8bd5dce9daaab189f  build-armbian/armbian-files/different-files/deskbox/rootfs/usr/libexec/deskbox-front-panel" | sha256sum --check
          echo "5b1e00b677896714784630e76eb94105f0e2179ddfd89bca9c3b0b6cf69250d9  build-armbian/armbian-files/different-files/deskbox/rootfs/etc/systemd/system/deskbox-front-panel.service" | sha256sum --check
          echo "ff22962bef8b31af381f55cd87388d65dacd63367331af0a8a83ef8d5c12877a  build-armbian/armbian-files/different-files/deskbox/rootfs/etc/systemd/system/deskbox-front-panel-early.service" | sha256sum --check
          installer="build-armbian/armbian-files/different-files/deskbox/rootfs/usr/sbin/deskbox-install-emmc"
          echo "e4300003fc311ab607081dd76aca85f404a4b64482010f8ad1a7443fd2317dda  ${installer}" | sha256sum --check
          test -x build-armbian/armbian-files/different-files/deskbox/rootfs/usr/libexec/deskbox-bluetooth-ready
          test -x build-armbian/armbian-files/different-files/deskbox/rootfs/usr/libexec/deskbox-bluetooth-unblock
          sh -n build-armbian/armbian-files/different-files/deskbox/rootfs/usr/libexec/deskbox-bluetooth-unblock
          test -x build-armbian/armbian-files/different-files/deskbox/rootfs/usr/libexec/deskbox-front-panel
          test -x "${installer}"
          bash -n "${installer}"
          grep -Fxq 'After=systemd-modules-load.service systemd-rfkill.service' \
            build-armbian/armbian-files/different-files/deskbox/rootfs/etc/systemd/system/deskbox-bluetooth.service
          grep -Fxq 'ExecStartPre=/usr/sbin/rfkill unblock bluetooth' \
            build-armbian/armbian-files/different-files/deskbox/rootfs/etc/systemd/system/deskbox-bluetooth.service
          grep -Fxq 'ExecStartPost=/usr/libexec/deskbox-bluetooth-unblock' \
            build-armbian/armbian-files/different-files/deskbox/rootfs/etc/systemd/system/deskbox-bluetooth.service
          grep -Eq '^r[0-9]+:Desk Box:rk3528:rk3528-deskbox\.dtb:.*:deskbox:yes$' \
            build-armbian/armbian-files/common-files/etc/model_database.conf
          grep -aFq 'Rockchip RK3528 Generic TV Box' "${dtb}"
          grep -aFq 'aic8800d80' "${dtb}"
          ! grep -aFq 'ap6275s' "${dtb}"
          grep -aFq 'rockchip,rk3528-mali' "${dtb}"
          grep -aFq 'uart2m0-gpios' "${dtb}"
          ! grep -Eq '^(loss_enable|loss_value)=' "${firmware}/aic_userconfig_8800d80.txt"
          ! grep -Eq '^[[:space:]]*net\.netfilter\.nf_conntrack_helper[[:space:]]*=' \
            build-armbian/armbian-files/common-files/etc/sysctl.conf
          test "$(cat build-armbian/armbian-files/different-files/deskbox/rootfs/etc/timezone)" = "Asia/Ho_Chi_Minh"
          grep -qx 'options cfg80211 ieee80211_regdom=VN' \
            build-armbian/armbian-files/different-files/deskbox/rootfs/etc/modprobe.d/deskbox-regulatory.conf
          grep -qx 'options aic8800_sdio_wlan country_code=VN custregd=0' \
            build-armbian/armbian-files/different-files/deskbox/rootfs/etc/modprobe.d/aic8800-country.conf

      # Verify the smallest remote input first. A replaced/mistyped kernel
      # asset must fail before runner setup, the 773 MiB base download, or any
      # image work consumes minutes.
      - name: Download exact rk35xx kernel bundle
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          KERNEL_SHA256: ${{ inputs.kernel_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          kernel_parent="build-armbian/kernel/rk35xx"
          kernel_archive="${kernel_parent}/${KERNEL_VERSION}.tar.gz"
          kernel_url="https://github.com/ophub/kernel/releases/download/kernel_rk35xx/${KERNEL_VERSION}.tar.gz"
          mkdir -p "${kernel_parent}"
          curl --fail --show-error --location --retry 3 --output "${kernel_archive}" "${kernel_url}"
          echo "${KERNEL_SHA256}  ${kernel_archive}" | sha256sum --check
          tar -mxzf "${kernel_archive}" -C "${kernel_parent}"
          test -s "${kernel_parent}/${KERNEL_VERSION}/sha256sums"
          rm -f "${kernel_archive}"

      - name: Identify runner image
        id: runner-image
        shell: bash
        run: |
          set -euo pipefail
          image_id="${ImageOS:-${RUNNER_OS}}-${ImageVersion:-unknown}"
          image_id=$(printf '%s' "${image_id}" | tr -c 'A-Za-z0-9._-' '-')
          echo "id=${image_id}" >> "${GITHUB_OUTPUT}"

      - name: Restore rebuild dependency cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/deskbox-apt-cache
          key: deskbox-apt-${{ steps.runner-image.outputs.id }}-${{ hashFiles('.github/build-dependencies.txt') }}

      - name: Install rebuild dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -euo pipefail
          init_started=${SECONDS}
          echo "Disk before dependency installation:"
          df -hT /

          # ubuntu-24.04 already contains every regular rebuild tool below.
          # Cache only the four packages absent from a fresh runner; the large
          # qemu-user-static package is otherwise apt's dominant delay.
          apt_cache_dir="${RUNNER_TEMP}/deskbox-apt-cache"
          mkdir -p "${apt_cache_dir}"
          sudo apt-get -y update
          shopt -s nullglob
          cached_debs=("${apt_cache_dir}"/*.deb)
          if (( ${#cached_debs[@]} == 0 )); then
            (
              cd "${apt_cache_dir}"
              apt-get download \
                binfmt-support \
                device-tree-compiler \
                libfdt1 \
                qemu-user-static
            )
            cached_debs=("${apt_cache_dir}"/*.deb)
          fi
          (( ${#cached_debs[@]} == 4 )) || {
            echo "Expected four cached rebuild dependency packages, found ${#cached_debs[@]}." >&2
            exit 1
          }
          sudo apt-get -y --no-install-recommends install \
            $(<.github/build-dependencies.txt) "${cached_debs[@]}"
          sudo timedatectl set-timezone "${TZ}"

          required_commands=(
            chroot cmp cpio curl dd df dtc file findmnt flock gzip hexdump jq
            losetup lsblk lsinitramfs mkfs.ext4 mkfs.xfs mount parted partprobe
            pigz qemu-aarch64-static rsync sfdisk sha256sum tar tune2fs
            udevadm umount uuidgen wipefs
          )
          for required_command in "${required_commands[@]}"; do
            command -v "${required_command}" >/dev/null || {
              echo "Missing build command after dependency install: ${required_command}" >&2
              exit 1
            }
          done

          echo "Disk after dependency installation:"
          df -hT /
          echo "Rebuild dependencies installed in $((SECONDS - init_started)) seconds."

      - name: Save rebuild dependency cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/deskbox-apt-cache
          key: deskbox-apt-${{ steps.runner-image.outputs.id }}-${{ hashFiles('.github/build-dependencies.txt') }}

      - name: Create build volume
        shell: bash
        run: |
          set -euo pipefail
          readonly volume_size_gib=24
          readonly reserve_size_gib=4
          root_available_gib=$(df --block-size=1G / | awk 'NR == 2 { print $4 }')
          if (( root_available_gib < volume_size_gib + reserve_size_gib )); then
            echo "Need ${volume_size_gib} GiB build space plus ${reserve_size_gib} GiB reserve; runner has ${root_available_gib} GiB free." >&2
            exit 1
          fi

          sudo truncate -s "${volume_size_gib}G" /root.img
          build_device=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_device}"
          sudo mkdir -p /builder
          sudo mount "${build_device}" /builder
          sudo chown runner:runner /builder
          mkdir -p /builder/build/output/images
          ln -s /builder/build "${GITHUB_WORKSPACE}/build"
          df -hT / /builder

      - name: Download exact upstream base image
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          UPSTREAM_IMAGE: ${{ inputs.upstream_image }}
          UPSTREAM_SHA256: ${{ inputs.upstream_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${UPSTREAM_REPOSITORY}/releases/tags/${UPSTREAM_TAG}"
          image_url=$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${api_url}" | jq --exit-status --raw-output --arg name "${UPSTREAM_IMAGE}" \
            '[.assets[] | select(.name == $name)] |
             if length == 1 then .[0].browser_download_url
             else error("expected exactly one matching release asset") end')

          destination="${GITHUB_WORKSPACE}/build/output/images/${UPSTREAM_IMAGE}"
          curl --fail --show-error --location --retry 3 --output "${destination}" "${image_url}"
          echo "${UPSTREAM_SHA256}  ${destination}" | sha256sum --check
          echo "path=build/output/images/${UPSTREAM_IMAGE}" >> "${GITHUB_OUTPUT}"
          ls -lh "${destination}"

      - name: Rebuild Desk Box image
        id: rebuild
        uses: ./
        with:
          source_image: ${{ steps.source.outputs.path }}
          kernel_version: ${{ inputs.kernel_version }}
          builder_name: hudrucan

      - name: Select and checksum Desk Box output
        id: output
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version }}
          REBUILT_IMAGE: ${{ steps.rebuild.outputs.image_path }}
        shell: bash
        run: |
          set -euo pipefail
          output_directory="${{ steps.rebuild.outputs.output_path }}"
          build_id="r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          compact_name="desk-box-rk3528-${KERNEL_VERSION}-${build_id}.img.gz"
          image_path="${output_directory}/${compact_name}"
          if [[ "${REBUILT_IMAGE}" != "${image_path}" || ! -s "${image_path}" ]]; then
            echo "Unexpected Desk Box output: ${REBUILT_IMAGE}" >&2
            exit 1
          fi
          embedded_name=$(gzip --name --list --verbose "${image_path}" | tail -n 1 | awk '{print $NF}')
          if [[ "$(basename "${embedded_name}")" != "${compact_name%.gz}" ]]; then
            echo "Unexpected gzip embedded filename: ${embedded_name}" >&2
            exit 1
          fi
          echo "Gzip embedded filename: $(basename "${embedded_name}")"

          (
            cd "${output_directory}"
            sha256sum "${compact_name}" > "${compact_name}.sha256"
          )
          echo "image_path=${image_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${image_path}.sha256" >> "${GITHUB_OUTPUT}"
          ls -lh "${image_path}" "${image_path}.sha256"

      - name: Audit final image read-only
        env:
          IMAGE_PATH: ${{ steps.output.outputs.image_path }}
          KERNEL_VERSION: ${{ inputs.kernel_version }}
        shell: bash
        run: |
          set -euo pipefail
          audit_image="/builder/deskbox-audit.img"
          audit_root="/builder/audit"
          audit_loop=""

          cleanup() {
            sudo umount "${audit_root}/boot" 2>/dev/null || true
            sudo umount "${audit_root}/root" 2>/dev/null || true
            if [[ -n "${audit_loop}" ]]; then
              sudo losetup --detach "${audit_loop}" 2>/dev/null || true
            fi
            rm -f "${audit_image}"
          }
          trap cleanup EXIT

          rm -rf "${audit_root}"
          mkdir -p "${audit_root}/boot" "${audit_root}/root"
          pigz --decompress --stdout "${IMAGE_PATH}" > "${audit_image}"
          audit_loop=$(sudo losetup --find --show --partscan --read-only "${audit_image}")
          sudo udevadm settle
          test -b "${audit_loop}p1"
          test -b "${audit_loop}p2"
          sudo mount -o ro,noload "${audit_loop}p1" "${audit_root}/boot"
          sudo mount -o ro,noload "${audit_loop}p2" "${audit_root}/root"
          lsblk --fs "${audit_loop}"

          boot="${audit_root}/boot"
          root="${audit_root}/root"
          grep -qx 'fdtfile=rockchip/rk3528-deskbox.dtb' "${boot}/armbianEnv.txt"
          grep -qx 'console=display' "${boot}/armbianEnv.txt"
          grep -qx 'consoleargs=console=tty1' "${boot}/armbianEnv.txt"
          echo "bf284aae2aac156705657c8393f58c21bb1c306030fea5e1d7a78087586b129b  ${boot}/dtb/rockchip/rk3528-deskbox.dtb" | sha256sum --check
          source_dts="${GITHUB_WORKSPACE}/build-armbian/armbian-files/different-files/deskbox/dts/rk3528-deskbox.dts"
          roundtrip_dtb="${audit_root}/rk3528-deskbox-roundtrip.dtb"
          dtc -q -I dts -O dtb -o "${roundtrip_dtb}" "${source_dts}"
          cmp -s "${roundtrip_dtb}" "${boot}/dtb/rockchip/rk3528-deskbox.dtb"
          boot_features=$(sudo tune2fs -l "${audit_loop}p1" | sed -n 's/^Filesystem features:[[:space:]]*//p' | tr ' ' '\n' | grep -vx needs_recovery | sort | tr '\n' ' ' | sed 's/[[:space:]]*$//')
          test "${boot_features}" = '64bit dir_index dir_nlink ext_attr extent extra_isize filetype flex_bg has_journal huge_file large_file metadata_csum resize_inode sparse_super'
          test "$(sudo tune2fs -l "${audit_loop}p1" | awk -F: '$1 == "Filesystem state" { gsub(/^[[:space:]]+/, "", $2); print $2 }')" = 'clean'
          test "$(sudo tune2fs -l "${audit_loop}p1" | awk -F: '$1 == "Block size" { gsub(/[[:space:]]/, "", $2); print $2 }')" = '4096'
          test "$(sudo tune2fs -l "${audit_loop}p1" | awk -F: '$1 == "Inode size" { gsub(/[[:space:]]/, "", $2); print $2 }')" = '256'
          test "$(sudo tune2fs -l "${audit_loop}p1" | awk -F: '$1 == "Block count" { gsub(/[[:space:]]/, "", $2); print $2 }')" = '130816'
          test "$(sudo tune2fs -l "${audit_loop}p1" | awk -F: '$1 == "Inode count" { gsub(/[[:space:]]/, "", $2); print $2 }')" = '130816'
          test "$(grep -c '^fdtfile=' "${boot}/armbianEnv.txt")" -eq 1
          if grep -Eq '(^|[= ,])ttyS2([, ]|$)' "${boot}/armbianEnv.txt"; then
            echo "ttyS2 remains assigned to a console in armbianEnv.txt" >&2
            exit 1
          fi
          test "$(find "${boot}/dtb/rockchip" -type f -name '*.dtb' | wc -l)" -eq 1
          if find "${boot}/dtb" -type f \( -name '*.dts' -o -name '*.dtbo' \) -print -quit | grep -q .; then
            echo "Unexpected DTS/DTBO found in final image" >&2
            exit 1
          fi

          kernel_release="${KERNEL_VERSION}-rk35xx-ophub"
          module_tree="${root}/usr/lib/modules/${kernel_release}"
          test -f "${boot}/vmlinuz-${kernel_release}"
          test -d "${module_tree}"
          test "$(find "${root}/usr/lib/modules" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          test -z "$(find "${root}/usr/src" -maxdepth 1 -name 'linux-headers-*' -print -quit)"
          test -z "$(find "${module_tree}" -type l \( -name build -o -name source \) -print -quit)"
          find "${module_tree}" -type f -name 'aic8800_sdio_bsp.ko' -print -quit | grep -q .
          find "${module_tree}" -type f -name 'aic8800_sdio_wlan.ko' -print -quit | grep -q .

          test "$(cat "${root}/etc/timezone")" = 'Asia/Ho_Chi_Minh'
          test "$(readlink "${root}/etc/localtime")" = '/usr/share/zoneinfo/Asia/Ho_Chi_Minh'
          grep -qx 'options cfg80211 ieee80211_regdom=VN' "${root}/etc/modprobe.d/deskbox-regulatory.conf"
          grep -qx 'options aic8800_sdio_wlan country_code=VN custregd=0' "${root}/etc/modprobe.d/aic8800-country.conf"
          test "$(readlink "${root}/etc/systemd/system/serial-getty@ttyS2.service")" = '/dev/null'

          firmware="${root}/usr/lib/firmware"
          test "$(find "${firmware}" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)" = $'aic8800_sdio\nregulatory.db\nregulatory.db.p7s'
          echo "8490a8609f8801f9cc33617c975372f4a45b62a59c3728d8975f09de4ed5e678  ${firmware}/aic8800_sdio/aic_userconfig_8800d80.txt" | sha256sum --check
          echo "6d121e015ff1fb90a90649627d663511804771b37f6cb44c97066cfc313a067a  ${firmware}/aic8800_sdio/fmacfw_8800d80_u02.bin" | sha256sum --check
          echo "465106f3bb2945bbdebea99f6cde9465ae00d5829e188499d42449cbdf4fe82c  ${firmware}/aic8800_sdio/fmacfwbt_8800d80_u02.bin" | sha256sum --check
          echo "a526cbd02fcdc495f049f3ad6b5933cb08cd984b16790c716a060d582fee1a56  ${firmware}/aic8800_sdio/fw_adid_8800d80_u02.bin" | sha256sum --check
          echo "26183182bf07f8f7581e82da8b606d222591a12c56772e75146588eef5196242  ${firmware}/aic8800_sdio/fw_patch_8800d80_u02.bin" | sha256sum --check
          echo "a9f663eb7443bc8046f2479cedfcdd93001eb64761f855317dbdbbc077f475cf  ${firmware}/aic8800_sdio/fw_patch_table_8800d80_u02.bin" | sha256sum --check
          echo "19b2d6b2320b67cb874c5c5c266a8f348cf423d00c0b22d4ad2c737cc603beab  ${firmware}/aic8800_sdio/lmacfw_rf_8800d80_u02.bin" | sha256sum --check
          test "$(find "${firmware}/aic8800_sdio" -maxdepth 1 -type f | wc -l)" -eq 7
          echo "9d171281bfe7acc5d203007427f6075b704b7a48ff42ae25b9f490a0118fe7d2  ${firmware}/regulatory.db" | sha256sum --check
          echo "d1170298577027c2da346242627ff6cad09fbebaa96a6b2de07ada7c873dd337  ${firmware}/regulatory.db.p7s" | sha256sum --check
          ! grep -Eq '^(loss_enable|loss_value)=' "${firmware}/aic8800_sdio/aic_userconfig_8800d80.txt"
          lsinitramfs "${boot}/initrd.img-${kernel_release}" | grep -qx 'usr/lib/firmware/regulatory.db'
          lsinitramfs "${boot}/initrd.img-${kernel_release}" | grep -qx 'usr/lib/firmware/regulatory.db.p7s'
          echo "AIC8800D80 firmware and regulatory allowlist passed."

          bluez_status=$(dpkg-query --admindir="${root}/var/lib/dpkg" --show \
            --showformat='${db:Status-Abbrev} ${Version} ${Architecture}' bluez)
          test "${bluez_status}" = 'ii  5.66-1+deb12u2 arm64'
          test -x "${root}/usr/libexec/bluetooth/bluetoothd"
          test -x "${root}/usr/bin/hciattach"
          test -x "${root}/usr/bin/btattach"
          echo "f9a3003b6bb7bb79c6d017355c3ce6ba9b64d7f32fb95a8bf8158d6185c04f41  ${root}/usr/libexec/deskbox-bluetooth-ready" | sha256sum --check
          echo "996408f13c167f0907d97d1bb891bf30a5a5a5cee31d7c762eca0a38a7a86d3a  ${root}/usr/libexec/deskbox-bluetooth-unblock" | sha256sum --check
          echo "dce3bb6794144a5716933c924e358b8e0b2c0b61220e7b34740e8ce9beb5a20c  ${root}/etc/systemd/system/deskbox-bluetooth.service" | sha256sum --check
          test -x "${root}/usr/libexec/deskbox-bluetooth-unblock"
          sh -n "${root}/usr/libexec/deskbox-bluetooth-unblock"
          test "$(readlink "${root}/etc/systemd/system/multi-user.target.wants/deskbox-bluetooth.service")" = '../deskbox-bluetooth.service'
          test "$(readlink -e "${root}/etc/systemd/system/multi-user.target.wants/deskbox-bluetooth.service")" = "${root}/etc/systemd/system/deskbox-bluetooth.service"
          grep -Fxq 'After=systemd-modules-load.service systemd-rfkill.service' "${root}/etc/systemd/system/deskbox-bluetooth.service"
          grep -Fxq 'ExecStartPre=/usr/sbin/rfkill unblock bluetooth' "${root}/etc/systemd/system/deskbox-bluetooth.service"
          grep -Fxq 'ExecStartPost=/usr/libexec/deskbox-bluetooth-unblock' "${root}/etc/systemd/system/deskbox-bluetooth.service"
          grep -Fxq 'ConfigurationDirectoryMode=0755' "${root}/etc/systemd/system/bluetooth.service.d/deskbox.conf"
          grep -Fxq 'ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=sap,vcp,mcp,bap' \
            "${root}/etc/systemd/system/bluetooth.service.d/deskbox.conf"
          test ! -e "${root}/var/lib/systemd/rfkill"
          test -L "${root}/etc/systemd/system/bluetooth.target.wants/bluetooth.service"
          test -L "${root}/etc/systemd/system/dbus-org.bluez.service"
          echo "Pinned BlueZ package, Desk Box HCI payload and service enablement passed."

          echo "fc98793c00ff26d97cd5a4ab4dae67603dd158cc43efd2b8bd5dce9daaab189f  ${root}/usr/libexec/deskbox-front-panel" | sha256sum --check
          echo "5b1e00b677896714784630e76eb94105f0e2179ddfd89bca9c3b0b6cf69250d9  ${root}/etc/systemd/system/deskbox-front-panel.service" | sha256sum --check
          echo "ff22962bef8b31af381f55cd87388d65dacd63367331af0a8a83ef8d5c12877a  ${root}/etc/systemd/system/deskbox-front-panel-early.service" | sha256sum --check
          test -x "${root}/usr/libexec/deskbox-front-panel"
          test -x "${root}/usr/bin/python3"
          test -x "${root}/usr/bin/chronyc"
          test "$(readlink "${root}/etc/systemd/system/multi-user.target.wants/deskbox-front-panel.service")" = '../deskbox-front-panel.service'
          test "$(readlink "${root}/etc/systemd/system/sysinit.target.wants/deskbox-front-panel-early.service")" = '../deskbox-front-panel-early.service'
          test "$(readlink -e "${root}/etc/systemd/system/multi-user.target.wants/deskbox-front-panel.service")" = "${root}/etc/systemd/system/deskbox-front-panel.service"
          test "$(readlink -e "${root}/etc/systemd/system/sysinit.target.wants/deskbox-front-panel-early.service")" = "${root}/etc/systemd/system/deskbox-front-panel-early.service"
          echo "FD6551 front-panel payload and service enablement passed."

          installer="${root}/usr/sbin/deskbox-install-emmc"
          echo "e4300003fc311ab607081dd76aca85f404a4b64482010f8ad1a7443fd2317dda  ${installer}" | sha256sum --check
          test -x "${installer}"
          bash -n "${installer}"
          for tool in \
            usr/bin/fuser usr/bin/flock usr/bin/findmnt usr/bin/lsblk \
            usr/bin/rsync usr/bin/sort usr/bin/systemctl usr/bin/udevadm usr/sbin/blkid usr/sbin/blockdev \
            usr/sbin/e2fsck usr/sbin/mkfs.ext4 usr/sbin/partprobe usr/sbin/swapon \
            usr/sbin/sfdisk usr/sbin/tune2fs usr/sbin/wipefs; do
            test -x "${root}/${tool}" || { echo "Installer dependency missing: /${tool}" >&2; exit 1; }
          done
          echo "Desk Box eMMC installer payload, syntax and uncommon runtime dependencies passed."

          disabled_services=(
            watchdog.service
            rpcbind.socket
            rpcbind.service
            nfs-client.target
            openvpn.service
            vnstat.service
          )
          for unit in "${disabled_services[@]}"; do
            state=$(sudo systemctl --root="${root}" is-enabled "${unit}" 2>/dev/null || true)
            if [[ "${state}" != "disabled" ]]; then
              echo "Unused service is not disabled in final image: ${unit} (${state:-unknown})" >&2
              exit 1
            fi
          done
          echo "Unused watchdog, RPC/NFS, OpenVPN and vnStat services are disabled."

          test ! -e "${root}/var/lib/alsa/asound.state"
          ! grep -Eq '^[[:space:]]*net\.netfilter\.nf_conntrack_helper[[:space:]]*=' \
            "${root}/etc/sysctl.conf"
          grep -Fxq 'SUBSYSTEM=="net", KERNEL=="wlan*", ACTION=="add", RUN+="/sbin/iw dev %k set power_save off"' \
            "${root}/etc/udev/rules.d/10-wifi-disable-powermanagement.rules"
          test -f "${root}/etc/tmpfiles.d/journal-nocow.conf"
          echo "Desk Box stale ALSA, sysctl, Wi-Fi udev and ext4 tmpfiles cleanup passed."

          assert_absent() {
            if [[ -e "$1" ]]; then
              echo "Unexpected final-image path: $1" >&2
              exit 1
            fi
          }
          assert_absent "${root}/etc/custom_service/start_service.sh"
          assert_absent "${root}/etc/balance_irq"
          assert_absent "${root}/etc/modules-load.d/ophub-load-list.conf"
          assert_absent "${root}/usr/sbin/balethirq.pl"
          if [[ -f "${root}/etc/rc.local" ]] && grep -q '/etc/custom_service/start_service.sh' "${root}/etc/rc.local"; then
            echo "Generic startup hook remains in rc.local" >&2
            exit 1
          fi
          assert_absent "${root}/usr/share/armbian.bak"
          assert_absent "${root}/usr/lib/bak-nand-sata-install"
          assert_absent "${root}/usr/sbin/armbian-kernel"
          assert_absent "${root}/usr/sbin/armbian-update"
          assert_absent "${root}/usr/sbin/armbian-sync"
          assert_absent "${root}/usr/sbin/armbian-software"
          assert_absent "${root}/usr/share/ophub/armbian-software"
          if [[ -d "${root}/var/lib/apt/lists" ]] && find "${root}/var/lib/apt/lists" -type f -print -quit | grep -q .; then
            echo "APT package lists remain in final image" >&2
            exit 1
          fi
          if [[ -d "${root}/var/cache/apt/archives" ]] && find "${root}/var/cache/apt/archives" -type f -name '*.deb' -print -quit | grep -q .; then
            echo "APT package cache remains in final image" >&2
            exit 1
          fi
          if sudo test -e "${root}/root/.bash_history"; then
            echo "Root shell history remains in final image" >&2
            exit 1
          fi
          echo "Generic startup, backup and package-cache cleanup passed."

          grep -E '^(MODEL_NAME|FDTFILE|BOARD)=' "${root}/etc/ophub-release"
          grep -qx "MODEL_NAME='DeskBox'" "${root}/etc/ophub-release" || { echo "Desk Box model metadata missing" >&2; exit 1; }
          grep -qx "FDTFILE='rk3528-deskbox.dtb'" "${root}/etc/ophub-release" || { echo "Desk Box FDT metadata missing" >&2; exit 1; }
          grep -qx "BOARD='deskbox'" "${root}/etc/ophub-release" || { echo "Desk Box board metadata missing" >&2; exit 1; }
          if grep -iEq 'x88|p51|h96' "${root}/etc/armbian-release" "${root}/etc/ophub-release" "${boot}/armbianEnv.txt"; then
            echo "Foreign board identity found in active metadata" >&2
            exit 1
          fi

          idb_hash=$(sudo dd if="${audit_image}" bs=512 skip=64 count=5120 status=none | sha256sum | awk '{print $1}')
          loader_hash=$(sudo dd if="${audit_image}" bs=512 skip=64 count=16320 status=none | sha256sum | awk '{print $1}')
          uboot_hash=$(sudo dd if="${audit_image}" bs=512 skip=16384 count=16384 status=none | sha256sum | awk '{print $1}')
          printf 'idbloader copies: %s\nidbloader area:   %s\nU-Boot region:    %s\n' "${idb_hash}" "${loader_hash}" "${uboot_hash}"
          test "${idb_hash}" = 'a652135b8f9c00997a6739bd5356cb5758cee539b40fc88fb2f5b844891a9b16'
          test "${loader_hash}" = '50533be4f13708af21f74693f2240fc0e5867f045d0d143249654abc3fb0eb44'
          test "${uboot_hash}" = '2bef85bc03009c53078c310fd4447cd24bccbb2c2b5fd2e5bff74aa618ec17c1'

          echo "Desk Box final-image audit passed."
          sudo du -sh "${boot}" "${root}" "${IMAGE_PATH}"

      - name: Upload Desk Box image to this fork's Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_PATH: ${{ steps.output.outputs.image_path }}
          CHECKSUM_PATH: ${{ steps.output.outputs.checksum_path }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          UPSTREAM_IMAGE: ${{ inputs.upstream_image }}
        shell: bash
        run: |
          set -euo pipefail
          build_id="r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          release_tag="desk-box-rk3528-${{ inputs.kernel_version }}-${build_id}"
          release_title="${release_tag}"
          image_name=$(basename "${IMAGE_PATH}")
          image_sha256=$(awk '{print $1}' "${CHECKSUM_PATH}")
          short_sha="${GITHUB_SHA:0:8}"
          release_notes="$(printf '%s\n' \
            '## Desk Box Armbian' \
            '' \
            'Purpose-built Debian Bookworm image for the RK3528 Desk Box.' \
            '' \
            '### Image' \
            '' \
            "- Board profile: \`deskbox\`" \
            "- Kernel: \`${{ inputs.kernel_version }}-rk35xx-ophub\`" \
            '- DTB: `rockchip/rk3528-deskbox.dtb`' \
            '- Wi-Fi: AIC8800D80 SDIO, VN regulatory domain' \
            '- GPU: Lima kernel driver (Mali-450); Mesa userspace is not bundled yet' \
            '- Bluetooth: AIC8800D80 H4 over UART2_M0 at 1.5 Mbps, BlueZ 5.66' \
            '- Front panel: FD6551 HH:MM clock with Wi-Fi, LAN and USB status' \
            "- File: \`${image_name}\`" \
            "- SHA256: \`${image_sha256}\`" \
            '' \
            '### Provenance' \
            '' \
            "- Base: \`${UPSTREAM_REPOSITORY}@${UPSTREAM_TAG}/${UPSTREAM_IMAGE}\`" \
            "- Source: [\`${short_sha}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})" \
            "- Build: [GitHub Actions run #${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" \
            '' \
            '### Automated verification' \
            '' \
            '- Pinned input hashes verified.' \
            '- Final image mounted read-only and audited.' \
            '- Desk Box identity, canonical DTB round-trip, Batch 1 cleanup, regulatory database and AIC8800D80 firmware allowlist verified.' \
            '- Stale ALSA state, unsupported AIC keys, obsolete sysctl, over-broad Wi-Fi udev rule and ext4 NOCOW warning removed.' \
            '- BlueZ, UART2_M0 HCI service and deterministic Bluetooth rfkill unblock verified.' \
            '- FD6551 front-panel payload and automatic service enablement verified.' \
            '- Guarded Desk Box SD-to-eMMC installer and vendor-U-Boot-compatible BOOT ext4 profile audited.' \
            '- Unused watchdog, RPC/NFS, OpenVPN and vnStat services disabled.' \
            '- Kernel release, AIC8800 SDIO modules and raw bootloader regions verified.' \
            '- Generic updater/sync/software-center helpers and build artifacts absent.' \
            '' \
            '### Flash' \
            '' \
            'Flash the `.img.gz` directly with Balena Etcher. The extracted raw image uses the same compact basename.' \
            '' \
            '> Hardware status: automated build and image audit passed; microSD boot verification is still required.' \
            '> Debug login is `root` / `1234`; change it before using an untrusted network.' \
          )"
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release: ${release_tag}" >&2
            exit 1
          fi
          gh release create "${release_tag}" "${IMAGE_PATH}" "${CHECKSUM_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${release_title}" \
            --notes "${release_notes}"
