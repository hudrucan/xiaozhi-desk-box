[Service]
# Debian's existing /etc/bluetooth directory is mode 0755. Match it instead of
# asking systemd to recreate the configuration directory as read-only 0555.
ConfigurationDirectoryMode=0755

# These plugins require unsupported experimental interfaces (VCP/MCP/BAP) or
# a telephony SAP backend. Classic A2DP, AVRCP, HID and GATT remain enabled.
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=sap,vcp,mcp,bap
