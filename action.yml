name: Rebuild Desk Box Armbian
author: hudrucan
description: Rebuild the single RK3528 Desk Box image.

inputs:
  source_image:
    description: Path to the pinned compressed Armbian base image.
    required: true
  kernel_version:
    description: Exact rk35xx kernel version.
    required: false
    default: "6.1.157"
  builder_name:
    description: Builder signature stored in image metadata.
    required: false
    default: hudrucan

outputs:
  output_path:
    description: Directory containing the rebuilt image.
    value: ${{ steps.rebuild.outputs.output_path }}

runs:
  using: composite
  steps:
    - id: rebuild
      shell: bash
      env:
        SOURCE_IMAGE: ${{ inputs.source_image }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
        BUILDER_NAME: ${{ inputs.builder_name }}
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}"

        source_image="${SOURCE_IMAGE}"
        if [[ "${source_image}" != /* ]]; then
          source_image="${GITHUB_WORKSPACE}/${source_image}"
        fi
        if [[ ! -s "${source_image}" ]]; then
          echo "Base image not found: ${source_image}" >&2
          exit 1
        fi
        if [[ "${source_image}" != *.img.gz ]]; then
          echo "Expected a .img.gz base image: ${source_image}" >&2
          exit 1
        fi

        output_path="${GITHUB_ACTION_PATH}/build/output/images"
        mkdir -p "${output_path}"
        input_image="${output_path}/$(basename "${source_image%.gz}")"
        gzip --decompress --stdout "${source_image}" > "${input_image}"

        if [[ "$(basename "${input_image}")" != *-trunk_* ]]; then
          echo "Base image filename must contain -trunk_: ${input_image}" >&2
          exit 1
        fi

        sudo ./rebuild \
          -b deskbox \
          -a false \
          -k "${KERNEL_VERSION}" \
          -t ext4 \
          -n "${BUILDER_NAME// /-}"

        rm -f "${input_image}"
        if ! find "${output_path}" -maxdepth 1 -type f \
          -name "Armbian_*_rockchip_deskbox_*_${KERNEL_VERSION}_server_*.img.gz" \
          -print -quit | grep -q .; then
          echo "Desk Box rebuild produced no image in ${output_path}" >&2
          exit 1
        fi

        echo "output_path=${output_path}" >> "${GITHUB_OUTPUT}"
        ls -lh "${output_path}"

branding:
  icon: cpu
  color: gray-dark
